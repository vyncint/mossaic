# Release pipeline, triggered by pushing a v*.*.* tag.
# The human-side checklist lives in docs/RELEASING.md.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# Never cancel a release mid-publish; a duplicate tag push queues instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Compare tag against the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mossaic") | .version')"
          echo "tag=${tag} crate=${version}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v${tag} does not match the crate version ${version}. Bump the version (docs/RELEASING.md) before tagging."
            exit 1
          fi

  # Re-run the exact CI gates (fmt, clippy, test matrix, msrv, docs, deny).
  ci:
    name: ci
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  semver:
    name: cargo-semver-checks
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Look for a published baseline on crates.io
        id: published
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' https://crates.io/api/v1/crates/mossaic)"
          echo "crates.io responded ${status}"
          echo "found=$([ "$status" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Skip (first release, no baseline)
        if: steps.published.outputs.found != 'true'
        run: echo "mossaic is not on crates.io yet; skipping semver checks gracefully."
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        if: steps.published.outputs.found == 'true'
        with:
          package: mossaic

  publish:
    name: publish to crates.io
    needs: [ci, semver]
    runs-on: ubuntu-latest
    # The `release` environment only deploys from v* tags, so an OIDC
    # publish token can never be minted from a branch.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      # A stored publish token, scoped to this crate.
      #
      # Trusted Publishing would be better — short-lived, nothing at rest —
      # but it is configured *on a crate*, and a crate that has never been
      # published does not exist to configure. So the first release uses a
      # token and later ones should not: once 0.1.0 is on crates.io, set up
      # Trusted Publishing there, swap this step back to
      # `rust-lang/crates-io-auth-action` with `id-token: write`, and delete
      # the secret. docs/RELEASING.md has the steps.
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Extract notes from CHANGELOG.md
        run: .github/scripts/extract-changelog.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
