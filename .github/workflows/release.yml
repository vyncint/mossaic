# Release pipeline, triggered by pushing a v*.*.* tag.
# The human-side checklist lives in docs/RELEASING.md.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# Never cancel a release mid-publish; a duplicate tag push queues instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Compare tag against the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mossaic") | .version')"
          echo "tag=${tag} crate=${version}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v${tag} does not match the crate version ${version}. Bump the version (docs/RELEASING.md) before tagging."
            exit 1
          fi
      # Before `cargo publish`, which is the irreversible step. The
      # extraction used to run only in `github-release`, which `needs:
      # publish` — so a tag whose CHANGELOG section was present and empty
      # put the version permanently on crates.io and *then* died on a
      # message saying the section was missing. Recovery is not re-tagging
      # (RELEASING.md forbids it); it is creating the release by hand.
      #
      # `ci`, `semver` and `publish` all descend from this job, so nothing
      # publishes until the notes exist — which is what the runbook already
      # implied happened.
      - name: The CHANGELOG has notes for this version
        run: .github/scripts/extract-changelog.sh "$GITHUB_REF_NAME" > /dev/null

  # Re-run the exact CI gates (fmt, clippy, test matrix, msrv, docs, deny).
  ci:
    name: ci
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  semver:
    name: cargo-semver-checks
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Look for a published baseline on crates.io
        id: published
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' https://crates.io/api/v1/crates/mossaic)"
          echo "crates.io responded ${status}"
          echo "found=$([ "$status" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Skip (first release, no baseline)
        if: steps.published.outputs.found != 'true'
        run: echo "mossaic is not on crates.io yet; skipping semver checks gracefully."
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        if: steps.published.outputs.found == 'true'
        with:
          package: mossaic

  publish:
    name: publish to crates.io
    needs: [ci, semver]
    runs-on: ubuntu-latest
    # The `release` environment only deploys from v* tags, so an OIDC
    # publish token can never be minted from a branch.
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing (GitHub OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      # crates.io Trusted Publishing: the action exchanges this job's OIDC
      # token for a publish token that lives for minutes. No registry
      # credential is stored on the repository at all.
      #
      # 0.1.0 could not use this — Trusted Publishing is configured on a
      # crate, and the crate did not exist yet — so it went out with a stored
      # token that has since been deleted. Every release from 0.1.1 on uses
      # this path.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Re-extracted rather than carried through an artifact: the script is
      # deterministic over a file this job checks out, and `verify-version`
      # has already proved it succeeds. Passing it as an artifact would mean
      # two more third-party actions for a `cat`.
      - name: Extract notes from CHANGELOG.md
        run: .github/scripts/extract-changelog.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag

  # The platform archives and the tap formula, and the check that what was
  # published actually installs. Called rather than triggered: a release
  # created with `GITHUB_TOKEN` raises no event that can start a workflow, so
  # both of these sat on an `on: release` trigger that had never once fired.
  # Every run of either through 0.6.3 was a manual dispatch, and between the
  # tag and somebody remembering, the release had no binaries and
  # `brew install` served the previous version.
  binaries:
    name: binaries
    needs: github-release
    uses: ./.github/workflows/binaries.yml
    permissions:
      contents: write # upload the archives to the release
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    with:
      tag: ${{ github.ref_name }}

  install:
    name: install
    needs: binaries
    uses: ./.github/workflows/install.yml
    with:
      version: ${{ github.ref_name }}

  # Tell the repository that tests this tool against a real subject that a
  # new version exists, so the deep run happens now rather than at its next
  # scheduled tick.
  #
  # Best-effort by design. The testing repositories all resolve "latest" from
  # crates.io on a schedule of their own, so a dispatch that never arrives --
  # an expired token, a release cut by hand, a fork without the secret --
  # costs latency and nothing else. That is why this job never fails the
  # release: a published crate is published whether or not the notification
  # landed.
  #
  # Needs a PAT with `contents: write` on contribution-art, stored as
  # TESTING_REPO_DISPATCH_TOKEN. Without it the job says so and exits clean.
  notify-testing-repo:
    name: notify-testing-repo
    needs: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch to contribution-art
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TESTING_REPO_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::TESTING_REPO_DISPATCH_TOKEN is not set; contribution-art will pick this up on its own schedule instead"
            exit 0
          fi
          gh api repos/vyncint/contribution-art/dispatches \
            -f event_type=tool-published \
            -F "client_payload[version]=${TAG#v}" \
            && echo "dispatched tool-published to contribution-art" \
            || echo "::warning::could not dispatch to contribution-art; it will pick this up on its own schedule"
