# Release pipeline, triggered by pushing a v*.*.* tag.
# The human-side checklist lives in docs/RELEASING.md.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# Never cancel a release mid-publish; a duplicate tag push queues instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Compare tag against the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mossaic") | .version')"
          echo "tag=${tag} crate=${version}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v${tag} does not match the crate version ${version}. Bump the version (docs/RELEASING.md) before tagging."
            exit 1
          fi

  # Re-run the exact CI gates (fmt, clippy, test matrix, msrv, docs, deny).
  ci:
    name: ci
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  semver:
    name: cargo-semver-checks
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Look for a published baseline on crates.io
        id: published
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' https://crates.io/api/v1/crates/mossaic)"
          echo "crates.io responded ${status}"
          echo "found=$([ "$status" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Skip (first release, no baseline)
        if: steps.published.outputs.found != 'true'
        run: echo "mossaic is not on crates.io yet; skipping semver checks gracefully."
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        if: steps.published.outputs.found == 'true'
        with:
          package: mossaic

  publish:
    name: publish to crates.io
    needs: [ci, semver]
    runs-on: ubuntu-latest
    # The `release` environment only deploys from v* tags, so an OIDC
    # publish token can never be minted from a branch.
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing (GitHub OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      # crates.io Trusted Publishing: the action exchanges this job's OIDC
      # token for a publish token that lives for minutes. No registry
      # credential is stored on the repository at all.
      #
      # 0.1.0 could not use this — Trusted Publishing is configured on a
      # crate, and the crate did not exist yet — so it went out with a stored
      # token that has since been deleted. Every release from 0.1.1 on uses
      # this path.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Extract notes from CHANGELOG.md
        run: .github/scripts/extract-changelog.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag

  # Prebuilt binaries, so that using mossaic does not require a Rust toolchain.
  #
  # The reason is not convenience. The whole pitch for contributing a template
  # is that it needs no Rust -- a template is a text file -- and that pitch is
  # false if the only way to *see* what you drew is `cargo install`. Somebody
  # who does not write Rust should not have to install a compiler to draw a
  # picture.
  #
  # Linux targets are **musl**, so the binary is statically linked and runs on
  # any distribution regardless of its glibc. Building against the runner's
  # glibc would produce something that refuses to start on anything older than
  # the runner, which for a download people keep for a year is the wrong
  # trade.
  #
  # Every target builds on its own architecture rather than cross-compiling:
  # GitHub gives public repositories arm64 runners, and a native build is one
  # fewer thing that can be subtly wrong.
  binaries:
    name: ${{ matrix.target }}
    needs: github-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # --locked, because the point of a published binary is that it is the
      # one the lockfile describes and the tests ran against.
      #
      # The target reaches the shell as an environment variable rather than
      # interpolated into the script, which is how every other `run:` in this
      # repository takes an input.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="mossaic-${version}-${TARGET}"
          mkdir "$stage"
          suffix=""
          case "$TARGET" in *windows*) suffix=".exe" ;; esac
          for binary in mossaic mossaic-art mossaic-glyphs; do
            cp "target/${TARGET}/release/${binary}${suffix}" "$stage/"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$stage/"
          # The templates ship inside the binary, but a copy beside it is what
          # someone starts from when drawing their own.
          cp -r art/templates "$stage/templates"

          case "$TARGET" in
            *windows*)
              7z a "${stage}.zip" "$stage" > /dev/null
              archive="${stage}.zip"
              ;;
            *)
              tar czf "${stage}.tar.gz" "$stage"
              archive="${stage}.tar.gz"
              ;;
          esac

          # Checksums beside the archive: a download nobody can verify is a
          # download nobody should run.
          sums() {
            if command -v sha256sum > /dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi
          }
          sums "$archive" > "${archive}.sha256"

          # A second copy without the version in the name, because
          # `releases/latest/download/<asset>` resolves by *exact* file name --
          # so a URL that is stable across releases cannot contain the version.
          # The versioned name is what cargo-binstall and the Homebrew formula
          # look for; the unversioned one is what a person copies out of the
          # README and keeps working next release.
          alias="${archive/-${version}-/-}"
          cp "$archive" "$alias"
          sums "$alias" > "${alias}.sha256"

          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "ALIAS=$alias" >> "$GITHUB_ENV"

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$ARCHIVE" "${ARCHIVE}.sha256" \
            "$ALIAS" "${ALIAS}.sha256" --clobber

  # Tell the repository that tests this tool against a real subject that a
  # new version exists, so the deep run happens now rather than at its next
  # scheduled tick.
  #
  # Best-effort by design. The testing repositories all resolve "latest" from
  # crates.io on a schedule of their own, so a dispatch that never arrives --
  # an expired token, a release cut by hand, a fork without the secret --
  # costs latency and nothing else. That is why this job never fails the
  # release: a published crate is published whether or not the notification
  # landed.
  #
  # Needs a PAT with `contents: write` on contribution-art, stored as
  # TESTING_REPO_DISPATCH_TOKEN. Without it the job says so and exits clean.
  notify-testing-repo:
    name: notify-testing-repo
    needs: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch to contribution-art
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TESTING_REPO_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::TESTING_REPO_DISPATCH_TOKEN is not set; contribution-art will pick this up on its own schedule instead"
            exit 0
          fi
          gh api repos/vyncint/contribution-art/dispatches \
            -f event_type=tool-published \
            -F "client_payload[version]=${TAG#v}" \
            && echo "dispatched tool-published to contribution-art" \
            || echo "::warning::could not dispatch to contribution-art; it will pick this up on its own schedule"
